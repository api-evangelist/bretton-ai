aid: bretton-ai
name: Bretton AI
description: 'Bretton AI (formerly Greenlite AI) is an AI-native operations platform
  for the financial back office, providing audit-ready agentic AI that staffs regulated
  financial-crime compliance work for banks and fintechs. Its agents automate AML
  alert investigation, KYC/CDD/EDD reviews, sanctions screening, and ongoing transaction
  monitoring inside existing systems, pairing large language models with a proprietary
  Trust Infrastructure layer that enforces deterministic compliance rules, audit logging,
  model risk management, and 100% traceability for BSA/AML audits. The platform ships
  pre-built skill templates with 180+ data-source connectors, a natural-language agent
  Builder, and a collaborative human-AI Workbench, integrating with 25+ enterprise
  systems including Salesforce, Oracle, nCino, ServiceNow, FICO, and Actimize. Bretton
  is SOC 2 Type II certified and GDPR compliant, backed by Greylock and Sapphire Ventures
  (Series B, 2026). This profile was added to the API Evangelist network from the Greylock
  portfolio; the company exposes no public developer API surface at this time.'
